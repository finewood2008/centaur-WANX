<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>万象 —— 超级个体的应用创造器</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #0f1117;
      color: #e6e6e6;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid #23262f;
      background: #14161d;
    }
    header h1 { margin: 0; font-size: 18px; font-weight: 600; }
    header .subtitle { color: #8a8f9c; font-size: 13px; margin-left: 10px; }
    #new-app {
      background: #23262f;
      color: #e6e6e6;
      border: 1px solid #33363f;
      border-radius: 8px;
      padding: 7px 14px;
      cursor: pointer;
      font-size: 13px;
    }
    #new-app:hover { background: #2c303b; }
    #run-banner {
      display: none;
      background: #1a2333;
      border-bottom: 1px solid #2a3a55;
      padding: 10px 20px;
      font-size: 13px;
      color: #7aa2f7;
    }
    main {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg { max-width: 72%; padding: 10px 14px; border-radius: 12px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
    .msg.user { align-self: flex-end; background: #2b6de0; color: #fff; border-bottom-right-radius: 4px; }
    .msg.assistant { align-self: flex-start; background: #1d2029; color: #e6e6e6; border-bottom-left-radius: 4px; }
    .msg.system { align-self: center; background: transparent; color: #8a8f9c; font-size: 13px; padding: 4px 10px; }
    .msg .label { font-size: 12px; color: #8a8f9c; margin-bottom: 4px; font-weight: 600; }
    footer {
      display: flex;
      gap: 8px;
      padding: 14px 20px;
      border-top: 1px solid #23262f;
      background: #14161d;
      align-items: flex-end;
    }
    textarea {
      flex: 1;
      background: #1d2029;
      color: #e6e6e6;
      border: 1px solid #33363f;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      resize: none;
      font-family: inherit;
      min-height: 42px;
      max-height: 120px;
      line-height: 1.4;
    }
    textarea:focus { outline: none; border-color: #2b6de0; }
    button {
      background: #2b6de0;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 11px 18px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
    }
    button:hover { background: #3b7bf0; }
    button.secondary { background: #23262f; border: 1px solid #33363f; }
    button.secondary:hover { background: #2c303b; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .typing { color: #8a8f9c; font-size: 13px; align-self: flex-start; }
  </style>
</head>
<body>
  <header>
    <div>
      <span style="font-weight:700">万象</span>
      <span class="subtitle" id="header-sub">超级个体的应用创造器</span>
    </div>
    <button id="new-app" style="display:none">+ 创建新应用</button>
  </header>

  <div id="run-banner"></div>

  <main id="messages"></main>

  <footer>
    <textarea id="input" placeholder="描述你想创建的应用……" rows="1"></textarea>
    <button id="generate" class="secondary" style="display:none">生成应用</button>
    <button id="send">发送</button>
  </footer>

  <script>
    const messagesEl = document.getElementById("messages");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const generateBtn = document.getElementById("generate");
    const newAppBtn = document.getElementById("new-app");
    const runBanner = document.getElementById("run-banner");
    const headerSub = document.getElementById("header-sub");

    let mode = "create"; // create | run
    let createMessages = [];
    let runMessages = [];
    let currentApp = null; // { name, slug }
    let busy = false;

    function addMsg(role, text, label) {
      const div = document.createElement("div");
      div.className = "msg " + role;
      if (label) {
        const l = document.createElement("div");
        l.className = "label";
        l.textContent = label;
        div.appendChild(l);
      }
      div.appendChild(document.createTextNode(text));
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    function addSystem(text) {
      const div = document.createElement("div");
      div.className = "msg system";
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function setTyping(on) {
      let t = messagesEl.querySelector(".typing");
      if (on) {
        if (!t) {
          t = document.createElement("div");
          t.className = "typing";
          t.textContent = "正在思考…";
          messagesEl.appendChild(t);
          messagesEl.scrollTop = messagesEl.scrollHeight;
        }
      } else if (t) {
        t.remove();
      }
    }

    function setBusy(on) {
      busy = on;
      sendBtn.disabled = on;
      generateBtn.disabled = on;
      input.disabled = on;
    }

    async function api(path, payload, timeoutMs = 120000) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), timeoutMs);
      try {
        const r = await fetch(path, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
          signal: ctrl.signal,
        });
        return await r.json();
      } finally {
        clearTimeout(timer);
      }
    }

    function switchMode(m) {
      mode = m;
      messagesEl.innerHTML = "";
      if (m === "create") {
        newAppBtn.style.display = "none";
        generateBtn.style.display = "inline-block";
        input.placeholder = "描述你想创建的应用……";
        headerSub.textContent = "超级个体的应用创造器";
        runBanner.style.display = "none";
        addMsg("assistant", "你好！我是应用引导者，通过对话帮你创建专属应用。想做一个什么样的应用？", "应用引导者");
      } else {
        newAppBtn.style.display = "inline-block";
        generateBtn.style.display = "none";
        input.placeholder = "对应用说点什么……";
        headerSub.textContent = "正在运行：" + currentApp.name;
        runBanner.style.display = "block";
        runBanner.textContent = "● 应用「" + currentApp.name + "」已就绪，正在运行中";
        for (const m of runMessages) addMsg(m.role, m.content, m.label);
      }
    }

    async function sendCreate(text) {
      createMessages.push({ role: "user", content: text });
      addMsg("user", text, "你");
      setTyping(true);
      try {
        const data = await api("/api/chat", { messages: createMessages, generate: false });
        setTyping(false);
        if (data.ok) {
          createMessages.push({ role: "assistant", content: data.reply });
          addMsg("assistant", data.reply, "应用引导者");
          // 渲染候选选项（点选即发送）
          if (Array.isArray(data.options) && data.options.length > 0) {
            const wrap = document.createElement("div");
            wrap.style.cssText = "align-self:flex-start;display:flex;flex-wrap:wrap;gap:8px;max-width:80%;";
            for (const opt of data.options) {
              const b = document.createElement("button");
              b.className = "secondary";
              b.textContent = opt;
              b.style.cssText = "padding:8px 14px;font-size:13px;border-radius:18px;";
              b.addEventListener("click", () => {
                if (!busy) { setBusy(true); sendCreate(opt).finally(() => setBusy(false)); }
              });
              wrap.appendChild(b);
            }
            messagesEl.appendChild(wrap);
            messagesEl.scrollTop = messagesEl.scrollHeight;
          }
        } else {
          addMsg("assistant", "出错了：" + (data.error || "未知错误"), "系统");
        }
      } catch (e) {
        setTyping(false);
        addMsg("assistant", "请求出错：" + e.message, "系统");
      }
    }

    async function generateApp() {
      setTyping(true);
      try {
        const data = await api("/api/chat", { messages: createMessages, generate: true });
        setTyping(false);
        if (data.ok && data.done && data.app) {
          addMsg("assistant", data.reply, "应用引导者");
          currentApp = { name: data.app.name, slug: data.app.slug };
          runMessages = [];
          // 切换到运行界面，并让应用主动打招呼（真实 persona）
          switchMode("run");
          addSystem("正在启动应用「" + currentApp.name + "」…");
          setTyping(true);
          const greet = await api("/api/run", { app: currentApp.slug, prompt: "你好，请简单介绍一下你自己" }, 180000);
          setTyping(false);
          if (greet.ok) {
            runMessages.push({ role: "assistant", content: greet.reply, label: currentApp.name });
            addMsg("assistant", greet.reply, currentApp.name);
          } else {
            addMsg("assistant", "启动失败：" + (greet.error || "未知错误"), "系统");
          }
        } else if (data.ok) {
          addMsg("assistant", data.reply, "应用引导者");
        } else {
          addMsg("assistant", "出错了：" + (data.error || "未知错误"), "系统");
        }
      } catch (e) {
        setTyping(false);
        addMsg("assistant", "请求出错：" + e.message, "系统");
      }
    }

    async function sendRun(text) {
      addMsg("user", text, "你");
      setTyping(true);
      try {
        const data = await api("/api/run", { app: currentApp.slug, prompt: text }, 180000);
        setTyping(false);
        if (data.ok) {
          runMessages.push({ role: "user", content: text, label: "你" });
          runMessages.push({ role: "assistant", content: data.reply, label: currentApp.name });
          addMsg("assistant", data.reply, currentApp.name);
        } else {
          addMsg("assistant", "出错了：" + (data.error || "未知错误"), "系统");
        }
      } catch (e) {
        setTyping(false);
        addMsg("assistant", "请求出错：" + e.message, "系统");
      }
    }

    async function handleSend() {
      const text = input.value.trim();
      if (!text || busy) return;
      input.value = "";
      setBusy(true);
      try {
        if (mode === "create") await sendCreate(text);
        else await sendRun(text);
      } finally {
        setBusy(false);
      }
    }

    sendBtn.addEventListener("click", handleSend);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        handleSend();
      }
    });
    generateBtn.addEventListener("click", () => {
      if (!busy) {
        setBusy(true);
        generateApp().finally(() => setBusy(false));
      }
    });
    newAppBtn.addEventListener("click", () => {
      createMessages = [];
      runMessages = [];
      currentApp = null;
      switchMode("create");
    });

    // 初始进入创建视图
    switchMode("create");
  </script>
</body>
</html>
