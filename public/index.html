<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>半人马AI-万象</title>
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <link rel="stylesheet" href="/static/app.css?v=2ae8cf83">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <img class="brand-mark" src="/static/logo-256.png" alt="" width="36" height="36">
        <div>
          <span class="brand-zh">半人马AI-万象</span>
          <span class="brand-en">CentaurAI-WanX</span>
        </div>
      </div>
      <button class="make" id="restart" type="button">
        <span class="make-plus" aria-hidden="true">＋</span>
        <span><span class="make-zh">造一个助手</span><span class="make-en">Build an assistant</span></span>
      </button>
      <div class="side-label"><span>我的助手</span><span id="app-count">0</span></div>
      <nav id="app-list" class="app-list" aria-label="我的助手"></nav>
      <div class="side-foot">
        <button id="open-settings" class="side-settings" type="button">
          <span>模型设置</span><span id="key-dot" class="key-dot" aria-hidden="true"></span>
        </button>
        <div class="side-foot-note">它在你自己的电脑上跑<br><span id="dsh-state">还没开始</span></div>
      </div>
    </aside>

    <section class="center">
      <div class="topbar">
        <div>
          <div class="top-title" id="top-title">造一个助手</div>
          <div class="top-en" id="top-en">Build an assistant</div>
        </div>
        <div class="meters" id="meters" hidden>
          <div class="meter">
            <div class="meter-top"><span>已聊清</span><b id="m1">0 / 9</b></div>
            <div class="meter-track"><div class="meter-fill" id="f1"></div></div>
          </div>
          <div class="meter doc">
            <div class="meter-top"><span>文档已写</span><b id="m2">0 / 11</b></div>
            <div class="meter-track"><div class="meter-fill" id="f2"></div></div>
          </div>
        </div>
      </div>
      <div class="scroll" id="scroll"><div class="stage" id="stage"></div></div>
    </section>

    <aside class="prd">
      <div class="prd-bar">
        <div>
          <div class="prd-bar-zh">助手需求文档</div>
          <div class="prd-bar-en">Assistant PRD</div>
        </div>
        <button class="expand" id="expand" type="button">展开文档</button>
      </div>
      <div class="prd-scroll" id="prd-scroll"></div>
      <div class="prd-foot">
        <button class="btn-solid" id="to-confirm" type="button" disabled>通读并确认</button>
        <div class="prd-foot-note" id="foot-note">还没开始</div>
      </div>
    </aside>
  </div>

  <div class="overlay hidden" id="overlay">
    <div class="overlay-inner">
      <div class="overlay-bar">
        <div>
          <div class="prd-bar-zh">助手需求文档</div>
          <div class="prd-bar-en">Assistant PRD</div>
        </div>
        <button class="btn-quiet" id="overlay-close" type="button">收起</button>
      </div>
      <div id="overlay-doc"></div>
    </div>
  </div>

  <script src="/static/app.js?v=2ae8cf83"></script>
</body>
</html>
