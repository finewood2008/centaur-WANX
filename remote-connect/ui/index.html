<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>万象 · 远程访问</title><link rel="stylesheet" href="style.css"></head><body><main><p class="eyebrow">CENTAURAI · WANX</p><h1>让知君，在外也能连接。</h1><p class="intro">授权你的电脑连接这台服务器。对话、记忆和知识库仍由各自的账户管理。</p><section><div class="line"><h2>远程访问</h2><span id="state">正在检查…</span></div><p id="detail"></p><div class="actions"><button id="enable" disabled>开启远程访问</button><button id="disable" class="secondary" disabled>关闭远程访问</button></div></section><section id="setup"><h2>设置协调服务</h2><p>首次使用需要配置公网协调服务。向部署管理员获取接入配置后粘贴到这里。</p><form id="setup-form"><label for="config">管理员接入配置</label><textarea id="config" rows="5" required placeholder="粘贴专用协调服务的接入配置"></textarea><button>保存配置</button></form></section><section><h2>连接一台知君电脑</h2><p>配对码 15 分钟内有效，只能用于注册一台设备。请仅发送给你要授权的人。</p><button id="pair" disabled>生成一次性配对码</button><textarea id="code" rows="4" readonly hidden aria-label="一次性配对码"></textarea><p id="expires"></p></section><section><div class="line"><h2>已授权的电脑</h2><button class="secondary" id="refresh">刷新</button></div><div id="nodes">尚未读取设备。</div></section><p id="error" role="alert"></p><footer>服务器端连接服务在后台运行。关闭此窗口不会关闭远程访问。</footer></main><script src="app.js"></script></body></html>
