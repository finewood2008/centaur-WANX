[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "wanx-bridge"
version = "0.1.0"
description = "Independent platform authorization boundary for an unmodified Octop service"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "websockets>=15,<17",
  "anyio>=4,<5",
  "PyJWT>=2.8,<3",
  "cryptography>=41",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4"]

[tool.hatch.build.targets.wheel]
packages = ["wanx_bridge", "wanx_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["..", "."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]
