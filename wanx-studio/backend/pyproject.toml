[project]
name = "wanx-app-studio"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["fastapi==0.119.0", "uvicorn==0.37.0", "httpx==0.28.1"]

[dependency-groups]
dev = ["pytest==8.4.2", "pytest-asyncio==1.2.0"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wanx_studio"]

[tool.hatch.build.hooks.custom]
path = "wanx_studio/_build.py"
foundation-policy = "../core/wanx-foundation.json"

[tool.pytest.ini_options]
asyncio_mode = "auto"
