[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "wanx-super-clipboard"
version = "0.1.0"
description = "Independent clipboard business service using public WANX APIs"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27"]

[project.scripts]
wanx-clipboard = "wanx_clipboard.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["wanx_clipboard"]
