<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>万象 · 安装海报轮播预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#ece7df;color:#302c28;font-family:system-ui,"Microsoft YaHei UI",sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}
main{width:min(980px,calc(177.778dvh - 533.334px),100%);min-width:min(340px,100%);border-radius:22px;background:#fcf9f5;border:1px solid #ddd1c4;box-shadow:0 24px 80px #55453418;overflow:hidden}
header{padding:24px 30px;display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:22px;margin:0 0 7px}p{margin:0;color:#81766b;font-size:13px}.tag{font-size:12px;color:#a35d40;padding:7px 12px;background:#f2e8dd;border-radius:30px;white-space:nowrap}
.frame{aspect-ratio:16/9;background:#f2ebe2;position:relative;overflow:hidden}.frame img{width:100%;height:100%;object-fit:contain;display:block}.controls{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:19px 30px;border-top:1px solid #e7ddd1}.index{color:#a35d40;font-size:14px}.buttons{display:flex;gap:9px}button{font:inherit;font-size:13px;border:1px solid #ddcdbd;background:#fcf9f5;color:#765d49;padding:8px 15px;border-radius:30px;cursor:pointer}button:hover{background:#f2e8dd}button:focus-visible{outline:2px solid #a35d40;outline-offset:3px}
.progress{padding:0 30px 25px}.track{height:5px;background:#e8dfd3;border-radius:20px;overflow:hidden;margin-bottom:12px}.track span{display:block;width:38%;height:100%;background:#a35d40}.progress p{font-size:11px;line-height:1.6}@media(max-width:580px){body{padding:10px}header,.controls{padding:18px}.tag{display:none}.buttons{gap:5px}button{padding:7px 10px}}
</style>
<main>
 <header><div><h1>正在安装万象</h1><p>应用 · 空间 · 盒子</p></div><span class="tag">安装界面预览 · 非实际安装</span></header>
 <section class="frame" aria-label="万象三个板块的产品海报"><img id="poster" src="apps-v1.png" alt="应用，让 AI 融入日常"></section>
 <div class="controls"><span class="index" id="index" aria-live="polite">1 / 3 · 应用</span><div class="buttons"><button id="prev" aria-label="上一张海报">上一张</button><button id="pause" aria-pressed="false">暂停</button><button id="next" aria-label="下一张海报">下一张</button></div></div>
 <div class="progress"><div class="track" aria-hidden="true"><span></span></div><p>此页仅演示海报轮播。实际安装进度由安装任务驱动，不会因播放海报而延长安装。</p></div>
</main>
<script>
const slides=[['apps-v1.png','应用','让 AI 融入日常'],['space-v1.png','空间','安放你的文件与资料'],['box-v1.png','盒子','连接你的 AI 底座']];
let index=0,paused=matchMedia('(prefers-reduced-motion: reduce)').matches,timer;
const poster=document.getElementById('poster'),counter=document.getElementById('index'),pause=document.getElementById('pause');
function show(offset){index=(index+offset+3)%3;poster.src=slides[index][0];poster.alt=slides[index][1]+'，'+slides[index][2];counter.textContent=(index+1)+' / 3 · '+slides[index][1];}
function schedule(){clearInterval(timer);pause.textContent=paused?'播放':'暂停';pause.setAttribute('aria-pressed',String(paused));if(!paused)timer=setInterval(()=>show(1),5500);}
document.getElementById('prev').onclick=()=>{show(-1);schedule();};document.getElementById('next').onclick=()=>{show(1);schedule();};pause.onclick=()=>{paused=!paused;schedule();};schedule();
</script>
</html>
